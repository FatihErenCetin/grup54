[project]
name = "ensemble"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["ensemble-backend", "ensemble-shared", "ensemble-mcp"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/backend", "src/shared", "src/mcp"]

[dependency-groups]
# NOT: TestClient'in ihtiyaci olan httpx, ensemble-backend'in kendi bagimliligi
# olarak gelir (github client) — dev grubuna ayrica eklenmez. "httpx2" (fork/
# typosquat adayi) buradan bilinçli cikarildi.
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv.sources]
ensemble-backend = { workspace = true }
ensemble-shared = { workspace = true }
ensemble-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# Toplama YALNIZ `tests/` altinda yapilir.
#
# NEDEN (olculdu, 2026-07-28): `testpaths` tanimsizken pytest repo KOKUNDEN
# tarar. `make paket-macos` calisinca `packaging/build-macos/dmg-stage/`
# altinda `Applications -> /Applications` SEMBOLIK BAGI olusuyor (DMG'de
# surukle-birak hedefi, normal ve gerekli). pytest o bagi TAKIP EDIP gercek
# `/Applications`'i tariyor -- Xcode.app'in kendi Python test paketi dahil
# 8000+ dosya. Sonuc: `pytest -q` bitmiyor, "gizemli takilma" gibi gorunuyor.
#
# Iki bagimsiz ajan bu tuzaga ayni gece dustu. `.gitignore` BU ISI GORMEZ --
# pytest gitignore'a bakmaz.
testpaths = ["tests"]
markers = [
    "integration: dış servis gerektiren ve varsayılan CI'da skip edilebilen testler",
]
