[project]
name = "ensemble-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ensemble-shared",
    "google-genai>=1.0,<2.0",
    "tenacity>=8.2,<10",
    "pyjwt[crypto]>=2.8,<3",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2",
    # T-294/D-57: email+parola üyelik — argon2id parola hash'i. bcrypt YERİNE
    # (72-bayt sessiz kırpma tuzağı var); bkz. api/credentials.py.
    "argon2-cffi>=23.1,<24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ensemble"]
