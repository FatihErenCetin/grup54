name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install   # sürüm .python-version'dan

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Eval precision-gate (#30): dedektor/judge regresyonunda kirmizi.
      # precision veya F0.5 kalibre tabanin (eval/kalibrasyon-raporu.md) altina
      # duserse build kirilir. FakeJudge ile offline/deterministik.
      - name: Eval precision-gate (#30)
        run: make eval-gate

      # Eval cagri-sayisi butcesi (#256): precision-gate'in maliyet ikizi. Sabit
      # fixture uzerinde RadarService.collect() sayacli sahte port'larla kosar;
      # judge/embed/GitHub cagrisi beyan edilen butceyi asarsa kirmizi (ör. dosya-
      # kesisimi filtresi kaldirilirsa aday sayisi C(n,2)'ye firlar). Zaten
      # `make test` icinde de kosuyor (tests/unit/test_butce_eval.py) - bu adim
      # eval-gate ile ayni belt-and-suspenders deseni izler.
      - name: Eval cagri-sayisi butcesi (#256)
        run: make eval-butce

      # Kontrat drift-check (#20): router'lar degisip openapi.json commit'lenmediyse kirmizi
      # Bu adim zorunlu-check listesindeki `lint-test` job'inda yasar (main branch
      # protection). Job'i ayri/zorunlu-olmayan bir job'a TASIMA — enforcement
      # sessizce kaybolur (fail-open). Detay: docs/kontrat-drift-guardrail.md (#56)
      - name: OpenAPI drift-check
        run: |
          make openapi
          git diff --exit-code src/shared/openapi.json || {
            echo "::error::openapi.json kod ile senkron degil. Duzelt: 'make contracts' calistir, sonra src/shared/openapi.json + src/frontend/src/api/schema.d.ts dosyalarini commit'le. Detay: docs/kontrat-drift-guardrail.md"
            exit 1
          }

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sir taramasi (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      # Uretilen TS tipleri spec'le senkron mu (#20): degilse kirmizi.
      # DIKKAT: job working-directory=src/frontend → pathspec cwd'ye GORELI
      # yazilmali; repo-koku yolu hicbir dosyayla eslesmez ve check no-op olur
      # (adversarial dogrulama bulgusu — kas testiyle kanitlandi)
      # Bu adim zorunlu-check listesindeki `frontend` job'inda yasar (main
      # branch protection). Job'i tasima/adini degistirme — bkz.
      # docs/kontrat-drift-guardrail.md (#56)
      - name: Client tip drift-check
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts openapi.json ile senkron degil. Duzelt: repo kokunde 'make contracts' calistir (openapi.json + schema.d.ts'i birlikte regen eder), ikisini de commit'le. Detay: docs/kontrat-drift-guardrail.md"
            exit 1
          }
