# Deploy CD: main -> self-hosted VDS otomatik deploy (#192).
#
# KAPININ GERCEK TANIMI (onemli, ucu yerde farkli olmasin diye buraya acikca
# yazildi): `workflow_run` tetikleyicisi bu dosyayi CI workflow'u (ci.yml,
# `name: CI`) TAMAMEN bittiginde calistirir. `github.event.workflow_run.
# conclusion == 'success'` demek CI'in TEK bir job'inin degil, UCUNUN DE
# (lint-test + gitleaks + frontend) yesil oldugu demektir -- workflow_run
# conclusion, workflow'un TUMUNUN sonucudur. Ham `push` tetikleyicisi bunu TEK
# BASINA saglayamaz: push aninda CI henuz sonuclanmamis olur. `workflow_run`
# CI'in BITTIGI ani + onun dogruladigi `head_sha`'yi verir; deploy TAM O
# commit'i checkout eder (kriter 6, asagida).
#
# FRONTEND ARTIK REQUIRED CHECK (main icin GitHub branch-protection required
# check listesi guncellendi: lint-test + check-single-issue + frontend).
# ESKI TUZAK ("PR'da frontend kirmizi olsa da merge olur, deploy'un kendi
# gate'i sessizce hicbir sey demeden durur") artik kapandi -- ama iki farkli
# katmanda: bu workflow'un `workflow_run` gate'i zaten baslangictan beri
# frontend dahil CI'in TAMAMINA bakiyordu (ustteki paragraf); yeni olan,
# ayni kuralin artik PR ASAMASINDA da zorlanmasi -- kirmizi frontend'li bir
# commit main'e hic giremiyor. Iki savunma katmani ayni tanimi paylasir; biri
# digerinin yerini almaz.
#
# TUZAKLAR ve kapatilmasi:
#   1) ci.yml hem push'ta hem pull_request'te kosuyor -> her PR de bir
#      workflow_run uretir. Uc-lu guard: event=='push' VE head_branch=='main'
#      VE head_repository.full_name==github.repository (fork/PR kosusu elenir;
#      yalniz `branches: [main]` filtresi YETMEZ -- fork'taki 'main' adli
#      daldan acilan PR de o filtreyi gecer).
#   2) workflow_run yalniz VARSAYILAN daldaki workflow dosyasindan tetiklenir
#      -> bu dosya bu PR'in kendi kosusunda HIC calismaz; ilk gercek kosu
#      merge SONRASI olur. workflow_dispatch main+CI-yesil kapisina tabi
#      ikinci bir yol olarak durur (bkz. tuzak 4 -- artik kacis kapisi DEGIL).
#   3) `workflows: ["CI"]` stringi ci.yml'in `name:` alanina baglidir; ci.yml
#      yeniden adlandirilirsa bu workflow SESSIZCE hic kosmaz (capraz-dosya
#      test: tests/unit/test_deploy_workflow.py::test_ci_ismi_deploy_kapisiyla_ayni).
#   4) (KAPATILDI, S192 review) `preflight.if` `workflow_dispatch || (...)`
#      seklinde bir `||` ile basliyordu -> elle tetik main+CI-yesil kapisinin
#      TAMAMINI short-circuit ediyordu: main DISINDAKI bir dal, CI hic
#      dogrulanmadan deploy edilebiliyordu (eski "main disi elle tetik
#      uyarisi" adimi bunu yalniz ::warning:: ile bildirip ENGELLEMIYORDU).
#      Kapatildi: workflow_dispatch artik `github.ref == 'refs/heads/main'`
#      ile SINIRLI VE ayni SHA icin basarili (conclusion=success) bir ci.yml
#      kosumu VAR MI diye `gh api actions/workflows/ci.yml/runs` ile
#      dogrulaniyor (preflight, asagida) -- bulamazsa `ci_ok=false` yazar (bkz.
#      tuzak 5), deploy hic denenmez. Elle tetik artik bir kacis kapisi DEGIL,
#      ayni iki kapiya (main + CI-yesil) tabi ikinci bir yol.
#   5) (KAPATILDI, S192 review - acik 2) Kapi 1b'nin TUM engelleme gucu
#      onceden ORTUK GitHub semantigine dayaniyordu: CI-dogrulama adimi
#      `exit 1` ile preflight job'ini FAIL ediyordu, deploy'un atlanmasi
#      "needs: preflight" + "job basarisiz olunca kendi if'i olan sonraki
#      job da SKIP edilir" varsayimina baliydi -- bu, dosyanin KENDI
#      "FAIL-SAFE HEDEF KAPISI" paragrafinin ogrettigi desenle
#      CELISIYORDU (ortuk needs-semantigine guvenme, acik bir OUTPUT'a
#      bagla; `has_target` deseni). Kapatildi: adim artik `exit 1` ATMAZ;
#      sonucu acikca `ci_ok=true|false` OUTPUT'una yazar (false iken
#      ::error:: ile gorunur bir aciklama basar), preflight bunu disari
#      verir, `deploy.if` hem `has_target` hem `ci_ok` outputlarina birlikte
#      BAGLIDIR -- `has_target` deseniyle BIREBIR ayni yontem, iki farkli
#      mekanizma degil. Otomatik (workflow_run) yolunda adim `event_name`'e
#      bakip DOGRUDAN `ci_ok=true` yazar (o yolda kapi zaten
#      `workflow_run.conclusion` ile saglaniyor) -- tek bir output her iki
#      tetikleyici yolunda da anlamli kalir.
#
# FAIL-SAFE HEDEF KAPISI (kritik kisit, T-192 self-host donusumu): self-host
# topolojisinde CD'nin hicbir kimlik bilgisine (secret) ihtiyaci YOK -- prod
# sirlari (DATABASE_URL, GEMINI_API_KEY, GITHUB_APP_*, GITHUB_WEBHOOK_SECRET,
# CORS_ORIGINS) sunucudaki `/etc/ensemble/ensemble.env` dosyasinda yasar ve
# compose'un `env_file:` alaniyla okunur -- GitHub'a hic girmezler. Geriye
# "deploy edilecek bir hedef var mi" sorusunun tek durust cevabi kaliyor:
# operator kurulumu bitirdigini beyan etti mi. Bu yuzden kapi bir SECRET
# degil, bir repo VARIABLE'i (`vars.DEPLOY_ENABLED`). `vars` `if:` icinde
# YASAK degil (secrets'in aksine), ama AYNI TUTARLI deseni (env -> step
# output -> job output -> `needs.` ile deploy.if) yine de kullaniyoruz --
# `smoke` job'i `vars.SMOKE_API_URL` icin zaten bunu yapiyor, ve testlerin
# tutamagi `needs.<job>.outputs.*` uzerinden (yarin ikinci bir deploy job'i
# eklenirse de yakalanabilsin diye). `[ "$DEPLOY_ENABLED" = "true" ]` TAM
# esitligi bilincli: kill-switch olarak `gh variable set DEPLOY_ENABLED
# --body false` ile CD 5 saniyede kapanir (token silmekte bu yoktu -- silinen
# deger geri gelmez). Deger SIR OLMADIGI icin `::notice::` ile yazdirilabilir
# (buyuk/kucuk harf tuzagini teshis kolaylastirir).
#
# SELF-HOSTED RUNNER (PULL modeli): sunucuya SSH anahtari KOYULMAZ, sunucuda
# inbound port ACILMAZ -- runner kendi outbound HTTPS baglantisini kurar ve
# GitHub'dan is ceker. `runs-on: [self-hosted, linux, x64, ensemble-prod]` --
# `linux`/`x64` GitHub'in otomatik etiketleri (yanlis OS/mimarideki bir
# runner'a yanlislikla eslesmeyi engeller), `ensemble-prod` bizim ozel
# etiketimiz. SIRALAMA (fail-safe DEGIL -- bu bir gercek risk): `preflight`
# GitHub-hosted'da kalir (runner canliligindan BAGIMSIZ degerlendirilir), ama
# `DEPLOY_ENABLED=true` set edilirken runner henuz Idle degilse `deploy`
# job'i KUYRUGA girer ve orada bekler (kirmizi olmaz ama sessizce asili
# kalir) -- operator `DEPLOY_ENABLED=true`'yu HER ZAMAN runner Settings ->
# Actions -> Runners'da Idle gorundukten SONRA set etmeli. `timeout-minutes:
# 30` job'in CALISMA suresini sinirlar (kuyruk suresini degil).
#
# DOGRULAYICI vs EYLEYICI ATLAMA (kritik ayrim, S192 review -- Semih): bu
# dosyada iki farkli "adimi atla" deseni var, ve BIREBIR AYNI degiller.
# Fail-safe atlamak DOGRULAYICI bir adimda (bir seyi KANITLAMAYA calisan,
# ama kendisi bir sey DEGISTIRMEYEN adim -- orn. `smoke`, asagida; ya da
# elle-tetikte `ci_check`) MESRUDUR: kosamayan bir kontrolu atlamak
# zararsizdir, cunku "dogrulayamadim" ile "dogruladim" arasinda bir YALAN
# yoktur -- adim yalnizca sessiz kalir. Ama EYLEYICI bir adimda (bir sey
# DEGISTIREN/URETEN adim -- orn. `compose_check`, asagida, deploy'un on
# kosulu) DEGILDIR: deploy'u atlayip job'i yine de basarili dondurmek
# "main'e giden her commit otomatik deploy edilir" vaadini SESSIZCE
# CIGNEMEK, yani DEPLOY BASARILI derken DOGRULANAN SHA HIC DEPLOY
# EDILMEMIS olmasidir -- bu bir YALAN, fail-safe degil. Asagidaki iki
# paragraf bu ayrimi somutlastirir.
#
# PROD COMPOSE DOSYASI FAIL-CLOSED (T-192/#246 bagimliligi, EYLEYICI adim --
# S192 review, Semih): `deploy/docker-compose.prod.yml` bu daldan AYRI bir
# PR'da (#246) ekleniyor; iki dalin main'e inis sirasi garanti degil. Eskiden
# `compose_check` adimi dosya yoksa build/up adimlarini `ready` cikisiyla
# fail-safe ATLIYOR, job yine de basarili donuyordu -- yukaridaki ayrima gore
# bu YANLISTI: `vars.DEPLOY_ENABLED` zaten "kurulum bitti" beyanidir (bkz.
# asagida FAIL-SAFE HEDEF KAPISI); operator onu `true` yaptiysa prod
# manifestinin YOKLUGU masum bir eksiklik degil, bir yanlis-yapilandirmadir.
# Kapatildi: `compose_check` artik FAIL-CLOSED -- dosya yoksa gorunur bir
# `::error::` basip `exit 1` verir, build/up adimlari (job zaten basarisiz
# oldugu icin, adimlarin kendi `if:`'ine gerek kalmadan) hic calismaz. (Hedef
# hic tanimli DEGILSE -- `vars.DEPLOY_ENABLED` != 'true' -- job zaten
# preflight kapisinda SKIP olur; o, DEGISMEYEN, mesru bir "deploy hic
# istenmedi" atlamasidir -- burasi BAMBASKA bir kapi.)
#
# IMAJ TAZE, YAPILANDIRMA BAYAT (#349 -- olculmus uretim olayi, 30 Tem 2026):
# bu workflow bugune kadar YALNIZ IMAJI tasidi. Konteyneri YARATAN compose
# dosyasinin `environment:` blogu ise sunucudaki IKINCI checkout'tan
# okunuyordu -- cunku sunucuda iki agac var:
#     /home/fatih/actions-runner/_work/grup54/grup54  -> CD, her kosuda taze
#     /home/fatih/grup54                              -> ELLE her compose komutu
# Ikincisi hicbir zaman tazelenmedi (73 commit geride, 26 Tem'de donmus) ve
# 30 Tem'de bir CORS duzeltmesi icin verilen ELLE komut konteyneri O dosyayla
# yeniden yaratti. Olculen sonuc: main'de RADAR_WINDOW_DAYS=14 /
# GITHUB_BACKFILL_LIMIT=150 iken konteynerde 2 / 10 -- #326'nin radar
# duzeltmesi (29 Tem merge) prod'a HIC ulasmadi, radar 30 Tem'de tamamen
# bosaldi (0 tespit). Ayni imajla yalniz compose tazelenince: 110 tespit.
# Yani "merge edildi = canlida gecerli" YANLISTI ve bunu soyleyen HICBIR
# sinyal yoktu. Iki adim eklendi (govdede KAPI 6 ve KAPI 7):
#   * KAPI 6 `ops_sync` -- elle-operasyon checkout'unu deploy'dan ONCE
#     deploy edilen TAM SHA'ya ff-merge eder (yol `vars.OPS_CHECKOUT_DIR`,
#     sabit kodlu DEGIL; tanimsizsa gorunur `::warning::`, tanimli ama
#     bozuksa fail-CLOSED),
#   * KAPI 7 -- `scripts/config_drift.py` ile deploy SONRASI konteynerin
#     GERCEK env'i ile main'in compose'unu karsilastirir (+ elle-operasyon
#     checkout'unun compose'unu). Ayrisma = KIRMIZI.
# Ayni script ayrica `config-drift.yml` ile PERIYODIK kosar: bu sinifin
# ZARARI iki deploy ARASINDA olusur (elle bir komut prod'u bozar ve bir
# sonraki merge'e kadar kimse gormez -- bu kez uc gun).
#
# SMOKE (deploy-sonrasi canli dogrulama, #189 BAGIMLILIGI, DOGRULAYICI adim):
# `deploy` basarili olunca `smoke` job'i `make smoke` calistirir (bkz.
# asagida). Bu dal (#192) #189'dan (T-189-live-smoke, `make smoke` hedefini
# ekleyen dal) ONCE main'e inebilir -- o yuzden `smoke` job'i calistirmadan
# once Makefile'da `smoke:` hedefinin GERCEKTEN var olup olmadigini kontrol
# eder; yoksa (#189 henuz merge olmamissa) adimi fail-safe ATLAR -- bu MESRU
# bir atlama (yukaridaki ayrima gore: smoke bir sey DEGISTIRMEZ, yalniz
# DOGRULAR), kirmizi vermez. Ama gorunurlugu artirilmisti (S192 review,
# Blocker 1): atlama mesaji artik `::notice::` DEGIL, `::warning::`
# seviyesindedir -- dogrulanmamis bir deploy kosusu ozetinde acikca GORUNSUN
# (deploy'un kendisi basarili olsa da, onu KANITLAYAN adim atlanmis olabilir).
# #189 merge olunca hedef belirir ve smoke kendiliginden aktiflesir -- bu
# dosyaya bir daha DOKUNMAYA gerek YOK. `smoke` BILINCLI olarak GitHub-
# hosted'da kalir (self-hosted'da DEGIL): prod kutusunun ICINDEN kosarsa
# loopback/ic ag uzerinden yesil olur ve DNS + Caddy + TLS + firewall
# zincirini hic kanitlamaz -- disaridan gercek bir HTTP istegi atmasi
# gerekir (runbook'un SMOKE_STRICT ilkesiyle ayni mantik).
#
# RELEASE/MIGRATE: bu workflow'un `docker compose ... up -d` adimi hicbir
# migration'i OTOMATIK kosturmaz (Fly'daki `release_command` esdegeri
# self-host compose'ta yok) -- migration hala elle `make migrate` ile (ya da
# sunucuda `docker compose exec api alembic upgrade head` ile) kosulur; bu
# workflow'a otomatik-migrate eklenmesi ayri bir karar/PR gerektirir.
#
# ACTION PIN: repo konvansiyonu hareketli `latest`/`master` KULLANMA diyor
# (bkz. Dockerfile ust basligi). `actions/checkout@v4` bu konvansiyona uyar.
#
# SHELL: GitHub'in Linux runner varsayilani `bash -e`dir -- `pipefail` YOK.
# `defaults.run.shell: bash` acikca burada beyan edilir; GitHub Actions bash
# icin bu beyani gordugunde adimlari `bash --noprofile --norc -eo pipefail
# {0}` ile kosturur (dokumantasyon). Bugun govdede pipe yok, fark uretmiyor --
# ama gelecekte bir `run:` adimina pipe eklenirse (orn. `cmd1 | cmd2`) bu
# beyan olmadan bir ust komut sessizce basarisiz olsa da pipeline yine de
# 0 ile doner (pipefail yoksa). Acik beyan bunu simdiden kapatir.
name: Deploy (Self-host)

on:
  workflow_run:
    workflows: ["CI"] # ci.yml `name:` ile ESLESIR -- capraz-dosya test 1/2
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # workflow_run'da GITHUB_TOKEN varsayilan yazma alabilir -- kapatiyoruz
  actions: read # elle tetikte ayni SHA icin basarili ci.yml kosumu var mi kontrolu (preflight, `gh api actions/workflows/ci.yml/runs`)

defaults:
  run:
    shell: bash # GitHub'in gercek varsayilanindan (pipefail'siz `bash -e`) acikca `-eo pipefail`'e gecer (yukaridaki SHELL notu)

concurrency:
  group: deploy
  cancel-in-progress: false # kosan deploy YARIDA KESILMEZ (yarim deploy/yarim release-migrate)

jobs:
  preflight:
    # Kapi 1 -- CI yesil + GERCEKTEN main'e push (PR/fork kosusu degil).
    # workflow_dispatch artik main'e SINIRLI (asagidaki `ref` kosulu) VE
    # asagidaki "CI yesilligini dogrula (ci_ok cikisi)" adimiyla (ci_ok
    # outputu uzerinden, bkz. tuzak 5) CI-yesil kapisina da tabi -- eskiden
    # buradaki `||` elle tetigi bu kapinin TAMAMINDAN muaf tutuyordu (bkz.
    # dosya basligi, tuzak 4).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      has_target: ${{ steps.target.outputs.has_target }}
      ci_ok: ${{ steps.ci_check.outputs.ci_ok }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Kapi 2 -- deploy HEDEFI yapilandirilmis mi. `vars` `if:` icinde
      # YASAKLI degil, ama secrets'la BIREBIR ayni fail-safe deseni (env
      # uzerinden okuyup boolean bir OUTPUT'a cevirmek) burada da uygulanir --
      # tutarlilik icin (bkz. dosya basligi, FAIL-SAFE HEDEF KAPISI).
      - name: Deploy hedefi tanimli mi? (vars.DEPLOY_ENABLED)
        id: target
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vars.DEPLOY_ENABLED='${DEPLOY_ENABLED}' (beklenen TAM deger: 'true') - deploy atlaniyor (fail-safe)."
          fi

      # Kapi 1b -- elle tetikte CI-yesil dogrulamasi; ACIK bir OUTPUT'a
      # baglanir (has_target deseniyle BIREBIR ayni -- bkz. tuzak 5). Adim
      # HER iki tetikleyicide de kosar (step-level `if` YOK -- kendi karari
      # icin EVENT_NAME'e bakar): otomatik (workflow_run) yolunda kapi zaten
      # workflow_run.conclusion ile saglandigindan dogrudan ci_ok=true yazar.
      # Elle tetikte, ayni head_sha ($SHA) icin main dalinda (branch=main),
      # push'tan gelen (event=push -- tuzak 1'deki filtreyle tutarli,
      # .workflow_runs[0]'in ORTUK siralamasina guvenilmez) ve tamamlanmis
      # (status=completed) EN SON ci.yml kosusunun conclusion=='success'
      # oldugunu `gh api` ile dogrular. Basarisizlikta (gh api'nin kendisi
      # sifir-disi exit ile patlasa da) job'i `exit 1` ile KIRMAZ -- ::error::
      # basar ve ci_ok=false yazar; deploy job'inin `if`'i bu outputa
      # `needs.` ile baglanir (asagida).
      - name: CI yesilligini dogrula (ci_ok cikisi)
        id: ci_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }} # dogrudan shell'e enterpole EDILMEZ, env uzerinden
          REPO: ${{ github.repository }} # ayni desen -- run govdesine dogrudan enterpole edilmez
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Otomatik (workflow_run) yol: kapi zaten workflow_run.conclusion ile saglaniyor.
            echo "ci_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! conclusion=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed" --jq '.workflow_runs[0].conclusion // "none"'); then
            echo "::error::gh api cagrisi basarisiz oldu (SHA=$SHA) -- CI durumu dogrulanamadi, guvenli taraf: deploy engellendi."
            echo "ci_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Elle tetiklenen commit ($SHA) icin basarili (conclusion=success) bir CI (ci.yml) kosumu bulunamadi (bulunan: $conclusion). Elle tetik CI-yesil kapisini atlayamaz -- once main'de CI'in gectiginden emin ol."
            echo "ci_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ci_ok=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    # Iki kapi BIRLIKTE: deploy hedefi VE CI-yesilligi -- her ikisi de acik
    # OUTPUT'a bagli (ortuk needs-basarisizlik semantigine DEGIL, tuzak 5).
    if: needs.preflight.outputs.has_target == 'true' && needs.preflight.outputs.ci_ok == 'true'
    # Sunucudaki self-hosted runner (PULL modeli, bkz. dosya basligi). `linux`/
    # `x64` GitHub'in otomatik etiketleri, `ensemble-prod` bizim ozel etiketimiz.
    runs-on: [self-hosted, linux, x64, ensemble-prod]
    timeout-minutes: 30 # job'in CALISMA suresini sinirlar (kuyruk suresini degil) -- asili bir build/up'i keser
    # KAPI 5 -- prod env dosyasi (S192 review, benim canli bulgum -- review'da
    # YOKTU): `deploy/docker-compose.prod.yml` (#246) `db`/`migrate`/`api`
    # servislerinde `${POSTGRES_PASSWORD:?...}` gibi ZORUNLU interpolasyonlar
    # tasir. Bunlari Compose servis-ici `env_file:`den DEGIL, KENDI
    # `--env-file`'indan cozer -- ikisi AYRI mekanizma: `env_file:` konteynerin
    # ICINE degisken enjekte eder (calisma-zamani), `--env-file` bu YAML
    # metninin `${...}` yerlerini DOLDURUR (parse-zamani, komut hangi servisi
    # hedeflerse hedeflesin TUM dosya interpolize edilir). `--env-file`
    # verilmeden `build`/`up` cagrilirsa Compose "required variable
    # POSTGRES_PASSWORD is missing" ile CD'nin ILK kosusunda PATLAR --
    # `vars.DEPLOY_ENABLED=true` yapildigi gun ortaya cikan bir regresyon
    # olurdu. Runner kendi checkout'unda kosar, orada `deploy/.env.production`
    # YOKTUR (gitignored) -- gercek sir dosyasi sunucuda
    # `/etc/ensemble/ensemble.env`dedir (640 root:docker). Burada job-seviyesinde
    # TEK bir yerde tanimlaniyor (asagidaki adimlarda TEKRAR edilmiyor) ki iki
    # kullanimi (env-var + CLI bayragi) birbirinden KAYMASIN:
    #   1) `ENSEMBLE_ENV_FILE` env degiskeni olarak -- compose dosyasinin KENDI
    #      `env_file: - ${ENSEMBLE_ENV_FILE:-.env.production}` satirini (elle
    #      kurulumun varsayilanini KORUYARAK) bu mutlak yola yonlendirir.
    #   2) `--env-file "$ENSEMBLE_ENV_FILE"` CLI bayragi olarak -- YAML'daki
    #      `${POSTGRES_PASSWORD:?...}` gibi ZORUNLU alanlari doldurur.
    # (Mutasyon kaniti PR govdesinde: bayrak/degisken kaldirilinca
    # test_deploy_workflow.py kirilir.)
    env:
      ENSEMBLE_ENV_FILE: /etc/ensemble/ensemble.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }} # CI'in dogruladigi TAM commit

      # Kapi 4 -- prod compose dosyasi (deploy/docker-compose.prod.yml) bu
      # daldan AYRI bir PR'da (#246) ekleniyor; iki dalin main'e inis sirasi
      # garanti degil. Bu EYLEYICI bir kapi (bkz. dosya basligi, DOGRULAYICI
      # vs EYLEYICI ATLAMA): dosya yoksa adim gorunur bir `::error::` basip
      # `exit 1` ile FAIL-CLOSED olur -- job derhal basarisiz olur, asagidaki
      # build/up adimlari (kendi `if:`'lerine gerek KALMADAN, bir onceki adim
      # basarisiz oldugu icin GitHub'in varsayilan davranisiyla) hic calismaz.
      # Fail-safe ATLAMA burada YOK: `vars.DEPLOY_ENABLED=true` operatorun
      # kurulumu bitirdigi beyanidir, manifestin YOKLUGU bir yanlis-
      # yapilandirmadir, masum bir eksiklik degil.
      - name: Prod compose dosyasi var mi? (EYLEYICI kapi -- fail-CLOSED)
        id: compose_check
        run: |
          if [ -f deploy/docker-compose.prod.yml ]; then
            exit 0
          fi
          echo "::error::deploy/docker-compose.prod.yml repoda yok (#246 henuz main'e inmemis olabilir). Bu EYLEYICI bir adimdir (deploy'un on kosulu) -- fail-safe ATLANAMAZ: vars.DEPLOY_ENABLED='true' zaten kurulumun bittigi beyanidir, prod manifestinin YOKLUGU bir yanlis-yapilandirmadir. Once #246'yi main'e indir."
          exit 1

      # KAPI 6 (#349) -- ELLE-OPERASYON CHECKOUT'unu tazele. Bu adim
      # olculmus bir uretim olayinin kapatilmasidir (bkz. dosya basligi,
      # "IMAJ TAZE, YAPILANDIRMA BAYAT"): sunucuda IKI checkout var; CD
      # kendi runner checkout'unda kosar, ama INSANIN yazdigi her `docker
      # compose` komutu digerinde (elle-operasyon dizini) kosar ve konteyneri
      # ORADAKI compose ile yeniden yaratir. O dizin git ile tazelenmedigi
      # icin 73 commit bayatlamis, #326'nin radar duzeltmesi prod'a HIC
      # ulasmamisti. Deploy'dan ONCE tazeleriz: bir sonraki elle komut, CD'nin
      # deploy ettigi TAM commit'in compose'unu gorsun.
      #
      # YOL SABIT KODLU DEGIL: `vars.OPS_CHECKOUT_DIR` (repo variable). Boyle
      # bir dizin OLMAYAN bir topoloji mesrudur (yalniz CD ile calisan bir
      # kurulum) -- o durumda adim SESSIZCE gecmez, gorunur bir `::warning::`
      # basar (deploy'u durdurmaz: deploy'un KENDISI dogru yapilmistir,
      # yalniz elle-operasyon hijyeni dogrulanmamistir).
      #
      # DEGISKEN SET EDILMISSE FAIL-CLOSED (compose_check ile ayni doktrin):
      # operator bir yol BEYAN ettiyse, o yolun git checkout'u olmamasi ya da
      # ff-merge'in basarisiz olmasi masum bir eksiklik degil, tam da bu
      # issue'nun sinifidir (yerel degisiklik/ayrik gecmis = bir sonraki elle
      # komut prod'u bozar). `--ff-only` BILINCLI: merge commit'i uretmez,
      # yerel commit varsa sessizce ezmez, gorunur sekilde patlar.
      # `--hard reset` KULLANILMAZ (operatorun yerel dosyalarini yok etmek CD
      # nin isi degil) -- kirmizi verip insani cagirmak dogru davranistir.
      #
      # HEDEF = deploy edilen TAM SHA (main'in hareketli ucu DEGIL): CD'nin
      # kendi "CI'in dogruladigi commit" disiplininin aynisi; iki checkout
      # ayni ana yakinsar, "pull sirasinda main ilerledi" yarisi olusmaz.
      # NOT: ad CIFT TIRNAKLI -- tirnaksiz bir YAML skalerinde " #349)" bir
      # YORUM baslatir ve adim adi Actions arayuzunde YARIM gorunur.
      - name: "Elle-operasyon checkout'unu tazele (yapilandirma drifti, #349)"
        id: ops_sync
        env:
          OPS_CHECKOUT_DIR: ${{ vars.OPS_CHECKOUT_DIR }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [ -z "$OPS_CHECKOUT_DIR" ]; then
            echo "::warning::vars.OPS_CHECKOUT_DIR tanimli degil -- elle-operasyon checkout'u TAZELENMEDI (#349). Sunucuda elle compose komutu kosturulan bir dizin varsa BAYAT kalir ve bir sonraki elle komut prod'u eski yapilandirmayla yeniden yaratir. Tanimlamak icin: gh variable set OPS_CHECKOUT_DIR --body /home/fatih/grup54"
            exit 0
          fi
          if [ ! -d "$OPS_CHECKOUT_DIR/.git" ]; then
            echo "::error::vars.OPS_CHECKOUT_DIR='$OPS_CHECKOUT_DIR' bir git checkout'u degil (.git yok). Operator bir yol BEYAN ettiyse o yol gecerli olmali -- fail-CLOSED (compose_check ile ayni doktrin)."
            exit 1
          fi
          onceki=$(git -C "$OPS_CHECKOUT_DIR" rev-parse HEAD)
          git -C "$OPS_CHECKOUT_DIR" fetch --quiet origin
          if ! git -C "$OPS_CHECKOUT_DIR" merge --ff-only "$SHA"; then
            echo "::error::'$OPS_CHECKOUT_DIR' deploy edilen commit'e ($SHA) ileri-sarilamadi: yerel commit, ayrik gecmis ya da calisma agacinda cakisan degisiklik var. Bu tam olarak #349'un sinifidir -- bir sonraki elle compose 'up -d' komutu prod'u BAYAT yapilandirmayla yeniden yaratir. Sunucuda dizini elle temizle (git status) ya da yolu kaldir: gh variable delete OPS_CHECKOUT_DIR"
            exit 1
          fi
          sonraki=$(git -C "$OPS_CHECKOUT_DIR" rev-parse HEAD)
          echo "::notice::Elle-operasyon checkout'u tazelendi ($OPS_CHECKOUT_DIR): $onceki -> $sonraki"

      # Imaji ONCE kur, SONRA recreate et: build patlarsa calisan servis
      # ayakta kalir (kesinti yalnizca `up -d`nin recreate penceresi kadar).
      # `-f` HICBIR ZAMAN atlanmaz: ciplak `docker compose up -d --build`
      # cwd'deki KOK docker-compose.yml'i okur -- o dosya Postgres'i
      # 0.0.0.0:5432'de ensemble/ensemble parolasiyla YAYINLAR (public IP'li
      # VDS'te aninda ele gecirme). `compose_check` yukarida zaten fail-closed
      # oldugu icin bu adimlarin ayrica bir `if:` kapisina ihtiyaci YOK --
      # dosya yoksa job zaten bu satira hic ulasmaz.
      - name: Prod imajini kur
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.sha }}
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$ENSEMBLE_ENV_FILE" build api

      # #262 kilidi: `docker-compose.prod.yml`'in `image:` alani artik
      # `ensemble-api:${IMAGE_TAG:-prod}` (eskiden sabit `ensemble-api:prod` --
      # yukaridaki `IMAGE_TAG` bu YAML'a HIC ULASMIYORDU, her deploy ayni
      # etiketi sessizce overwrite ediyordu, SHA-basina imaj gecmisi hic
      # olusmuyordu). Bir onceki adim imaji GERCEKTEN `ensemble-api:$IMAGE_TAG`
      # (bu SHA) olarak yaratti -- bu adim AYNI imaji `ensemble-api:prod`a da
      # isaretler ki (a) IMAGE_TAG'siz elle komutlar (runbook §3.1 adim 3, §5
      # "acil yol") HER ZAMAN son basarili CD imajini bulsun, sifirdan REBUILD
      # etmesin, (b) compose'un kendi varsayilani (`prod`) daima taze kalsin.
      - name: Prod etiketini guncelle (rollback icin SHA gecmisi + varsayilan prod)
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.sha }}
        run: docker tag "ensemble-api:$IMAGE_TAG" ensemble-api:prod

      - name: Prod servisleri ayaga kaldir
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.sha }}
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$ENSEMBLE_ENV_FILE" up -d --remove-orphans

      # KAPI 7 (#349) -- DEPLOY SONRASI YAPILANDIRMA DRIFTI KILIDI. Bu, "up -d
      # kostu" ile "CALISAN sistem main'in soyledigi ayarlarla kosuyor"
      # arasindaki BOSLUGU kapatir; uc gun boyunca kimsenin gormedigi bosluk
      # tam olarak buydu. Iki bagimsiz kontrol (scripts/config_drift.py):
      #   A) konteynerin GERCEK `Config.Env`'i <-> repo compose'unun
      #      `services.api.environment` DUZ anahtarlari,
      #   B) `vars.OPS_CHECKOUT_DIR`daki compose <-> repo'daki compose.
      # B, bir onceki adimin (ops_sync) POST-KOSULUDUR ve TOTOLOJI DEGILDIR:
      # ff-merge, calisma agacinda ELLE DEGISTIRILMIS bir compose dosyasina
      # dokunmadan da basarili olabilir -- o durumda merge yesil, dosya hala
      # bozuk, bir sonraki elle komut prod'u yine zehirler. Bu kontrol onu
      # yakalar.
      #
      # NEDEN `uv run` DEGIL: VDS'te `uv` KURULU DEGIL (olculdu: `which uv`
      # -> bos). Sistem python3'u (3.10.12) + PyYAML 5.4.1 mevcut (olculdu).
      # Ayni script yerelde `make config-drift` ile uv altinda kosar --
      # cagrilan DOSYA ayni (capraz-dosya testi bunu kilitler).
      #
      # Bu adim DOGRULAYICI ama fail-CLOSED: `continue-on-error` YOK ve
      # `|| true` YOK -- deploy "basarili" derken calisan yapilandirmanin
      # main'den farkli olmasi tam da bu issue'nun yalanidir.
      # #353 -- SCRIPT YOKSA GORUNUR SEKILDE ATLA, KIRMIZI VERME.
      # Olculen yaris (30 Tem, uc ardisik merge): GitHub workflow TANIMINI onu
      # iten commit'ten alir, ama deploy job'i `needs.preflight.outputs.sha`yi
      # checkout eder ve preflight CI'i YESIL olan SHA'yi secer. Hizli ardisik
      # merge'lerde yeni commit'in CI'i henuz bitmemis olur -> YENI workflow +
      # ESKI agac. Bu adimi ekleyen commit'in script'i o agacta YOKTUR:
      #   python3: can't open file '.../scripts/config_drift.py'  (exit 2)
      # Deploy'un kendisi sorunsuzken deploy KIRMIZI gorunuyordu.
      #
      # Atlama MESRU cunku drift kontrolu bir DOGRULAYICIdir (dosya basligindaki
      # ayrim): bir sey DEGISTIRMEZ, yalniz olcer. Script yoksa "o SHA'da bu
      # kontrol yok" demektir -- olculemez, ihlal edilmis DEGIL.
      # Ama SESSIZ degil: `::warning::`. Ve script VARSA fail-closed KALIR --
      # `|| true` YOK, drift bulursa deploy yine kirmizi (smoke adiminin
      # emsaliyle ayni desen, bkz. `smoke_check`).
      - name: "Yapilandirma driftini dogrula (konteyner <-> main, #349)"
        env:
          OPS_CHECKOUT_DIR: ${{ vars.OPS_CHECKOUT_DIR }}
          # `run:` govdesine DOGRUDAN `${{ }}` interpolasyonu yapilmaz -- deger
          # bir git SHA olsa bile kural kuraldir (shell enjeksiyonu yuzeyi
          # env uzerinden kapatilir; ayni desen dosyanin geri kalaninda da var).
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [ ! -f scripts/config_drift.py ]; then
            echo "::warning::scripts/config_drift.py deploy edilen agacta ($DEPLOY_SHA) YOK - drift kontrolu atlaniyor (#353: yeni workflow tanimi + eski agac yarisi). Bu SHA'da kontrol OLCULEMEDI; bir sonraki deploy'da kosacak."
            exit 0
          fi
          python3 scripts/config_drift.py --compose deploy/docker-compose.prod.yml

      # Kabul kriteri 4 (#262): disk sismesin -- son IMAGE_KEEP_COUNT SHA
      # etiketi (+ hep en taze imaja isaretli `prod`) tutulur, gerisi budanir.
      # BU ADIM NE DOGRULAYICI NE EYLEYICI (bkz. dosya basligi ayrimi): deploy
      # zaten basariyla bittikten SONRA kosan, geriye-donuk bir bakim adimidir
      # -- deploy'un ON KOSULU degildir. `continue-on-error: true` (job-
      # seviyesinde YASAKLI, bkz. test_deploy_job_hicbir_adiminda_continue_on_
      # error_yok) YERINE govde kendi icinde `set +e` ile yumusatilir ve HER
      # ZAMAN `exit 0` ile biter: tek bir `docker rmi` basarisiz olsa (imaj
      # hala referansli/kullanimda) bile az once basariyla biten deploy'u
      # geriye donuk kirmiziya CEVIRMEZ.
      - name: Eski imajlari budala (disk hijyeni -- son N surum tutulur)
        env:
          IMAGE_KEEP_COUNT: "5" # kac SHA-etiketli surum tutulur (VDS: 45G bos, imaj basina ~200-300 MB)
        run: |
          set +e
          eski_etiketler=$(docker images ensemble-api --format '{{.CreatedAt}}\t{{.Tag}}' \
            | grep -v -e $'\tprod$' -e $'\t<none>$' \
            | sort -r \
            | cut -f2 \
            | tail -n "+$((IMAGE_KEEP_COUNT + 1))")
          if [ -z "$eski_etiketler" ]; then
            echo "Budanacak eski imaj yok (tutulan surum: $IMAGE_KEEP_COUNT)."
            exit 0
          fi
          echo "$eski_etiketler" | while read -r etiket; do
            echo "Budaniyor: ensemble-api:$etiket"
            docker rmi "ensemble-api:$etiket"
          done
          exit 0

  smoke:
    # `deploy` disinda hicbir `if:` YOK -- job-level `if:` verilmezse
    # varsayilan davranis zaten `needs`'teki TUM job'larin basarili
    # (SKIP DEGIL) olmasini sart kosar: `deploy` preflight-hedef-yoklugundan
    # SKIP edilirse `smoke` de kendiliginden SKIP olur (kaskad fail-safe,
    # ustteki "FAIL-SAFE HEDEF KAPISI" notuyla TUTARLI -- ekstra kosul
    # yazmaya gerek yok). NOT: `deploy` job'inin KENDI ic `compose_check`'i
    # (yukarida) artik FAIL-CLOSED -- dosya yoksa `deploy` job'inin KENDISI
    # basarisiz olur, bu yuzden bu durumda `smoke` de (needs=[preflight,
    # deploy] kaskadiyla) kendiliginden SKIP olur; smoke YALNIZCA `deploy`
    # gercekten basarili (prod'a bir sey uygulanmis) oldugunda kosar.
    needs: [preflight, deploy]
    runs-on: ubuntu-latest # BILINCLI: self-hosted DEGIL (bkz. dosya basligi, SMOKE notu)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }} # deploy'lanan TAM commit

      # Kapi 3a -- SMOKE_API_URL repo variable'i VARLIK kontrolu. `vars`
      # `secrets` gibi `if:` icinde YASAKLI degil, ama ayni TUTARLI deseni
      # (env -> output -> sonraki adimlarin `if:`'i) kullaniyoruz: hedef
      # kapisiyla BIREBIR ayni fail-safe mantigi, iki farkli yontem degil.
      # Kapi 3b -- Makefile'da `smoke:` hedefi VAR MI: bu dal (#192) #189'dan
      # (T-189-live-smoke, hedefi ekleyen dal) ONCE main'e inebilir; hedef
      # yoksa `make smoke` "No rule to make target" ile PATLAR -- bu da
      # fail-safe atlanir (#189 bagimliligi, bkz. dosya basligi). Bu, smoke
      # DOGRULAYICI bir adim oldugu icin MESRU bir atlama (bkz. dosya
      # basligi, DOGRULAYICI vs EYLEYICI ATLAMA) -- ama gorunurlugu
      # `::notice::` yerine `::warning::` seviyesine yukseltildi (S192
      # review, Blocker 1): deploy basarili gorunse de onu KANITLAYAN adim
      # atlanmis olabilir, bu kosu ozetinde ACIKCA gorunmeli.
      - name: SMOKE_API_URL tanimli mi + make smoke hedefi var mi?
        id: smoke_check
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
        run: |
          if [ -z "$SMOKE_API_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::vars.SMOKE_API_URL tanimli degil - smoke adimi atlaniyor (fail-safe, dogrulanmamis deploy)."
            exit 0
          fi
          if ! grep -qE '^smoke:' Makefile; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Makefile'da 'smoke' hedefi yok (#189 henuz main'e inmemis olabilir) - adim atlaniyor (fail-safe, dogrulanmamis deploy)."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: uv kur
        if: steps.smoke_check.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Python kur
        if: steps.smoke_check.outputs.ready == 'true'
        run: uv python install

      - name: Bagimliliklari kur
        if: steps.smoke_check.outputs.ready == 'true'
        run: uv sync --all-packages --locked

      - name: make smoke
        if: steps.smoke_check.outputs.ready == 'true'
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }} # opsiyonel; bossa scripts/smoke.py CORS+SPA blogunu atlar
        run: make smoke
