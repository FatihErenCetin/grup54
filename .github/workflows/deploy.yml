# Deploy CD: main -> Fly otomatik deploy (#192).
#
# KAPININ GERCEK TANIMI (onemli, ucu yerde farkli olmasin diye buraya acikca
# yazildi): `workflow_run` tetikleyicisi bu dosyayi CI workflow'u (ci.yml,
# `name: CI`) TAMAMEN bittiginde calistirir. `github.event.workflow_run.
# conclusion == 'success'` demek CI'in TEK bir job'inin degil, UCUNUN DE
# (lint-test + gitleaks + frontend) yesil oldugu demektir -- workflow_run
# conclusion, workflow'un TUMUNUN sonucudur. Ham `push` tetikleyicisi bunu TEK
# BASINA saglayamaz: push aninda CI henuz sonuclanmamis olur. `workflow_run`
# CI'in BITTIGI ani + onun dogruladigi `head_sha`'yi verir; deploy TAM O
# commit'i checkout eder (kriter 6, asagida). Yerel esdeger `make deploy`
# (Makefile, #181) -- bu workflow onu CI-yesil kapisina baglar.
#
# FRONTEND ARTIK REQUIRED CHECK (main icin GitHub branch-protection required
# check listesi guncellendi: lint-test + check-single-issue + frontend).
# ESKI TUZAK ("PR'da frontend kirmizi olsa da merge olur, deploy'un kendi
# gate'i sessizce hicbir sey demeden durur") artik kapandi -- ama iki farkli
# katmanda: bu workflow'un `workflow_run` gate'i zaten baslangictan beri
# frontend dahil CI'in TAMAMINA bakiyordu (ustteki paragraf); yeni olan,
# ayni kuralin artik PR ASAMASINDA da zorlanmasi -- kirmizi frontend'li bir
# commit main'e hic giremiyor. Iki savunma katmani ayni tanimi paylasir; biri
# digerinin yerini almaz.
#
# TUZAKLAR ve kapatilmasi:
#   1) ci.yml hem push'ta hem pull_request'te kosuyor -> her PR de bir
#      workflow_run uretir. Uc-lu guard: event=='push' VE head_branch=='main'
#      VE head_repository.full_name==github.repository (fork/PR kosusu elenir;
#      yalniz `branches: [main]` filtresi YETMEZ -- fork'taki 'main' adli
#      daldan acilan PR de o filtreyi gecer).
#   2) workflow_run yalniz VARSAYILAN daldaki workflow dosyasindan tetiklenir
#      -> bu dosya bu PR'in kendi kosusunda HIC calismaz; ilk gercek kosu
#      merge SONRASI olur. workflow_dispatch main+CI-yesil kapisina tabi
#      ikinci bir yol olarak durur (bkz. tuzak 4 -- artik kacis kapisi DEGIL).
#   3) `workflows: ["CI"]` stringi ci.yml'in `name:` alanina baglidir; ci.yml
#      yeniden adlandirilirsa bu workflow SESSIZCE hic kosmaz (capraz-dosya
#      test: tests/unit/test_deploy_workflow.py::test_ci_ismi_deploy_kapisiyla_ayni).
#   4) (KAPATILDI, S192 review) `preflight.if` `workflow_dispatch || (...)`
#      seklinde bir `||` ile basliyordu -> elle tetik main+CI-yesil kapisinin
#      TAMAMINI short-circuit ediyordu: main DISINDAKI bir dal, CI hic
#      dogrulanmadan deploy edilebiliyordu (eski "main disi elle tetik
#      uyarisi" adimi bunu yalniz ::warning:: ile bildirip ENGELLEMIYORDU).
#      Kapatildi: workflow_dispatch artik `github.ref == 'refs/heads/main'`
#      ile SINIRLI VE ayni SHA icin basarili (conclusion=success) bir ci.yml
#      kosumu VAR MI diye `gh api actions/workflows/ci.yml/runs` ile
#      dogrulaniyor (preflight, asagida) -- bulamazsa `ci_ok=false` yazar (bkz.
#      tuzak 5), deploy hic denenmez. Elle tetik artik bir kacis kapisi DEGIL,
#      ayni iki kapiya (main + CI-yesil) tabi ikinci bir yol.
#   5) (KAPATILDI, S192 review - acik 2) Kapi 1b'nin TUM engelleme gucu
#      onceden ORTUK GitHub semantigine dayaniyordu: CI-dogrulama adimi
#      `exit 1` ile preflight job'ini FAIL ediyordu, deploy'un atlanmasi
#      "needs: preflight" + "job basarisiz olunca kendi if'i olan sonraki
#      job da SKIP edilir" varsayimina baliydi -- bu, dosyanin KENDI
#      "FAIL-SAFE SECRET KAPISI" paragrafinin ogrettigi desenle
#      CELISIYORDU (ortuk needs-semantigine guvenme, acik bir OUTPUT'a
#      bagla; `has_token` deseni). Kapatildi: adim artik `exit 1` ATMAZ;
#      sonucu acikca `ci_ok=true|false` OUTPUT'una yazar (false iken
#      ::error:: ile gorunur bir aciklama basar), preflight bunu disari
#      verir, `deploy.if` hem `has_token` hem `ci_ok` outputlarina birlikte
#      BAGLIDIR -- `has_token` deseniyle BIREBIR ayni yontem, iki farkli
#      mekanizma degil. Otomatik (workflow_run) yolunda adim `event_name`'e
#      bakip DOGRUDAN `ci_ok=true` yazar (o yolda kapi zaten
#      `workflow_run.conclusion` ile saglaniyor) -- tek bir output her iki
#      tetikleyici yolunda da anlamli kalir.
#
# FAIL-SAFE SECRET KAPISI (kritik kisit): GitHub Actions `if:` ifadelerinde
# `secrets` context'i KULLANILAMAZ (`if: secrets.X != ''` sessizce yanlis
# degerlendirilir -> kapi ters calisir). Bu yuzden `preflight` job'i token
# varligini `env:` uzerinden okuyup boolean bir OUTPUT'a cevirir; `deploy`
# job'i o output'a `needs.` ile baglanir. Token yoksa `deploy` SKIP edilir
# (failure DEGIL) -> main asla kirmizi olmaz. Ayni fail-safe CI kirmizi/PR
# kosusu icin de gecerli: `preflight` skip -> `needs` uzerinden `deploy` de
# skip. Token'in DEGERI hicbir yere yazilmaz/echo'lanmaz. `smoke` job'i de
# (asagida) AYNI deseni tekrar kullanir -- `vars.SMOKE_API_URL` icin.
#
# DAR KAPSAM TOKEN: FLY_API_TOKEN hesap token'i DEGIL, app-scoped deploy
# token'i olmali:
#   fly tokens create deploy -a ensemble-backend -x 8760h
#   gh secret set FLY_API_TOKEN --repo FatihErenCetin/grup54   # deger stdin'den
# Eslemenin kanonik kaynagi: docs/sprint3-kontratlar.md Ek A (satir zaten var).
#
# SIRALAMA UYARISI (fail-safe DEGIL -- bu bir gercek patlama riski): "secret
# VAR ama Fly app'i (`fly.toml`'daki `app = "ensemble-backend"`) HENUZ YOK"
# hali yukaridaki token-yoklugu kapisindan GECER (has_token=true, deploy
# SKIP edilmez) ama `flyctl deploy` olmayan bir app'e deploy etmeye
# calisinca PATLAR -- bu sessiz bir atlama DEGIL, kirmizi bir is. Dogru
# sira: ONCE `fly launch` (ya da `fly apps create ensemble-backend`) ile
# app'i olustur, SONRA `gh secret set FLY_API_TOKEN` ile token'i set et.
# (`fly tokens create deploy -a ensemble-backend` zaten app'in var olmasini
# sart kosar -- app yoksa komutun kendisi hata verir; bu sirayi tersine
# cevirmemek icin acikca burada yaziyor.)
#
# SMOKE (deploy-sonrasi canli dogrulama, #189 BAGIMLILIGI): `deploy` basarili
# olunca `smoke` job'i `make smoke` calistirir (bkz. asagida). Bu dal (#192)
# #189'dan (T-189-live-smoke, `make smoke` hedefini ekleyen dal) ONCE main'e
# inebilir -- o yuzden `smoke` job'i calistirmadan once Makefile'da `smoke:`
# hedefinin GERCEKTEN var olup olmadigini kontrol eder; yoksa (#189 henuz
# merge olmamissa) adimi fail-safe ATLAR, kirmizi vermez. #189 merge olunca
# hedef belirir ve smoke kendiliginden aktiflesir -- bu dosyaya bir daha
# DOKUNMAYA gerek YOK.
#
# RELEASE/MIGRATE: `flyctl deploy` fly.toml'daki `release_command`'i otomatik
# kosar; o satir henuz YOK ve #187'nin (Enes) isi -- bu workflow fly.toml'a
# DOKUNMAZ, yalnizca bu bagimliligi belgeler (kriter 6, kanit S192 review'da).
#
# ACTION PIN: upstream README `@master` gosteriyor; repo konvansiyonu hareketli
# `latest`/`master` KULLANMA diyor (bkz. Dockerfile ust basligi). `@v1` bugun
# 1.x'e isaret ediyor ve mevcut `actions/checkout@v4` tarziyla tutarli.
name: Deploy (Fly)

on:
  workflow_run:
    workflows: ["CI"] # ci.yml `name:` ile ESLESIR -- capraz-dosya test 1/2
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # workflow_run'da GITHUB_TOKEN varsayilan yazma alabilir -- kapatiyoruz
  actions: read # elle tetikte ayni SHA icin basarili ci.yml kosumu var mi kontrolu (preflight, `gh api actions/workflows/ci.yml/runs`)

concurrency:
  group: deploy
  cancel-in-progress: false # kosan deploy YARIDA KESILMEZ (yarim deploy/yarim release-migrate)

jobs:
  preflight:
    # Kapi 1 -- CI yesil + GERCEKTEN main'e push (PR/fork kosusu degil).
    # workflow_dispatch artik main'e SINIRLI (asagidaki `ref` kosulu) VE
    # asagidaki "CI yesilligini dogrula (ci_ok cikisi)" adimiyla (ci_ok
    # outputu uzerinden, bkz. tuzak 5) CI-yesil kapisina da tabi -- eskiden
    # buradaki `||` elle tetigi bu kapinin TAMAMINDAN muaf tutuyordu (bkz.
    # dosya basligi, tuzak 4).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}
      ci_ok: ${{ steps.ci_check.outputs.ci_ok }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Kapi 2 -- secret VARLIK kontrolu; `if:` degil `env:` uzerinden okunur
      # (secrets context if icinde calismaz), deger asla yazdirilmaz/loglanmaz.
      - name: FLY_API_TOKEN tanimli mi?
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN repo secret'i yok - deploy atlaniyor (fail-safe)."
          fi

      # Kapi 1b -- elle tetikte CI-yesil dogrulamasi; ACIK bir OUTPUT'a
      # baglanir (has_token deseniyle BIREBIR ayni -- bkz. tuzak 5). Adim
      # HER iki tetikleyicide de kosar (step-level `if` YOK -- kendi karari
      # icin EVENT_NAME'e bakar): otomatik (workflow_run) yolunda kapi zaten
      # workflow_run.conclusion ile saglandigindan dogrudan ci_ok=true yazar.
      # Elle tetikte, ayni head_sha ($SHA) icin main dalinda (branch=main),
      # push'tan gelen (event=push -- tuzak 1'deki filtreyle tutarli,
      # .workflow_runs[0]'in ORTUK siralamasina guvenilmez) ve tamamlanmis
      # (status=completed) EN SON ci.yml kosusunun conclusion=='success'
      # oldugunu `gh api` ile dogrular. Basarisizlikta (gh api'nin kendisi
      # sifir-disi exit ile patlasa da) job'i `exit 1` ile KIRMAZ -- ::error::
      # basar ve ci_ok=false yazar; deploy job'inin `if`'i bu outputa
      # `needs.` ile baglanir (asagida).
      - name: CI yesilligini dogrula (ci_ok cikisi)
        id: ci_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }} # dogrudan shell'e enterpole EDILMEZ, env uzerinden
          REPO: ${{ github.repository }} # ayni desen -- run govdesine dogrudan enterpole edilmez
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Otomatik (workflow_run) yol: kapi zaten workflow_run.conclusion ile saglaniyor.
            echo "ci_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! conclusion=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed" --jq '.workflow_runs[0].conclusion // "none"'); then
            echo "::error::gh api cagrisi basarisiz oldu (SHA=$SHA) -- CI durumu dogrulanamadi, guvenli taraf: deploy engellendi."
            echo "ci_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Elle tetiklenen commit ($SHA) icin basarili (conclusion=success) bir CI (ci.yml) kosumu bulunamadi (bulunan: $conclusion). Elle tetik CI-yesil kapisini atlayamaz -- once main'de CI'in gectiginden emin ol."
            echo "ci_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ci_ok=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    # Iki kapi BIRLIKTE: token varligi VE CI-yesilligi -- her ikisi de acik
    # OUTPUT'a bagli (ortuk needs-basarisizlik semantigine DEGIL, tuzak 5).
    if: needs.preflight.outputs.has_token == 'true' && needs.preflight.outputs.ci_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }} # CI'in dogruladigi TAM commit

      - name: flyctl kur
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Fly'a deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --remote-only

  smoke:
    # `deploy` disinda hicbir `if:` YOK -- job-level `if:` verilmezse
    # varsayilan davranis zaten `needs`'teki TUM job'larin basarili
    # (SKIP DEGIL) olmasini sart kosar: `deploy` preflight-token-yoklugundan
    # SKIP edilirse `smoke` de kendiliginden SKIP olur (kaskad fail-safe,
    # ustteki "FAIL-SAFE SECRET KAPISI" notuyla TUTARLI -- ekstra kosul
    # yazmaya gerek yok).
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }} # deploy'lanan TAM commit

      # Kapi 3a -- SMOKE_API_URL repo variable'i VARLIK kontrolu. `vars`
      # `secrets` gibi `if:` icinde YASAKLI degil, ama ayni TUTARLI deseni
      # (env -> output -> sonraki adimlarin `if:`'i) kullaniyoruz: token
      # kapisiyla BIREBIR ayni fail-safe mantigi, iki farkli yontem degil.
      # Kapi 3b -- Makefile'da `smoke:` hedefi VAR MI: bu dal (#192) #189'dan
      # (T-189-live-smoke, hedefi ekleyen dal) ONCE main'e inebilir; hedef
      # yoksa `make smoke` "No rule to make target" ile PATLAR -- bu da
      # fail-safe atlanir (#189 bagimliligi, bkz. dosya basligi).
      - name: SMOKE_API_URL tanimli mi + make smoke hedefi var mi?
        id: smoke_check
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
        run: |
          if [ -z "$SMOKE_API_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vars.SMOKE_API_URL tanimli degil - smoke adimi atlaniyor (fail-safe)."
            exit 0
          fi
          if ! grep -qE '^smoke:' Makefile; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Makefile'da 'smoke' hedefi yok (#189 henuz main'e inmemis olabilir) - adim atlaniyor (fail-safe)."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: uv kur
        if: steps.smoke_check.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Python kur
        if: steps.smoke_check.outputs.ready == 'true'
        run: uv python install

      - name: Bagimliliklari kur
        if: steps.smoke_check.outputs.ready == 'true'
        run: uv sync --all-packages --locked

      - name: make smoke
        if: steps.smoke_check.outputs.ready == 'true'
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }} # opsiyonel; bossa scripts/smoke.py CORS+SPA blogunu atlar
        run: make smoke
