# Lokal "hosted" mod denemesi (#61): pgvector'lu Postgres + backend imajı.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ensemble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ensemble}
      POSTGRES_DB: ensemble
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ensemble-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensemble -d ensemble"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENSEMBLE_MODE: hosted
      DATABASE_URL: postgresql+psycopg://ensemble:${POSTGRES_PASSWORD:-ensemble}@db:5432/ensemble
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ensemble-pg-data:
